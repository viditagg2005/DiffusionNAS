[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusionnas"
version = "0.1.0"
description = "Standardized training-free SD1.5 acceleration benchmark harness"
requires-python = ">=3.10"

[project.scripts]
diffusionnas = "diffusionnas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

